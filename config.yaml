name: "BL-HAOS"
slug: "bl_haos"
version: "0.2.71"
description: "High-fidelity Bluetooth audio streaming adapter for Home Assistant OS"
url: "https://github.com/Mahmoud-Eltabakh/BL-HAOS-Bridge"
image: "ghcr.io/mahmoud-eltabakh/{arch}-bl-haos-bridge"
arch:
  - aarch64
  - amd64
  - armv7
init: false
host_dbus: true
hassio_api: true
audio: true
full_access: true
udev: true
stage: "experimental"
# Supervisor watchdog. A repository app must declare this as a health-check URL:
# the Supervisor validates it against (http|https|tcp)://[HOST]:([PORT:n]|n) and
# only accepts the boolean form for local apps; a manifest that fails validation
# is skipped, which removes the app from the store. It polls this URL and
# restarts the container when the poll fails. /api/health answers HTTP 200
# whenever the daemon is alive, so a degraded bridge is not restarted in a loop.
watchdog: "http://[HOST]:[PORT:8099]/api/health"
options:
  incident_monitor: false
  log_level: "info"
  default_codec: "auto"
  playback_buffer_ms: 500
  ldac_quality: "sq"
discovery:
  - bl_haos
schema:
  incident_monitor: bool?
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
  default_codec: "list(auto|sbc|sbc_xq|aac|aptx|aptx_hd|ldac)?"
  # Bounded on purpose: the audio held ahead of a speaker is what a stutter-free
  # link trades against how long audio keeps playing after a pause.
  playback_buffer_ms: "int(50,2000)?"
  # LDAC only. `auto` is Adaptive Bitrate, which lowers the bitrate when the link
  # is marginal, so the quality of the same song changes as you listen.
  ldac_quality: "list(auto|hq|sq|mq)?"
