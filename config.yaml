name: "BL-HAOS"
slug: "bl_haos"
version: "0.2.40"
description: "High-fidelity Bluetooth audio streaming and multi-room adapter for Home Assistant OS"
url: "https://github.com/Mahmoud-Eltabakh/BL-HAOS-Bridge"
image: "ghcr.io/mahmoud-eltabakh/{arch}-bl-haos-bridge"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:speaker-bluetooth"
host_dbus: true
hassio_api: true
audio: true
full_access: true
udev: true
stage: "experimental"
options:
  log_level: "info"
  default_codec: "auto"
discovery:
  - bl_haos
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
  default_codec: "list(auto|sbc|sbc_xq|aac|aptx|aptx_hd|ldac)?"
