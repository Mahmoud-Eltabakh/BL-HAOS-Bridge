[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = .
addopts = -v --strict-markers -p asyncio
asyncio_mode = auto
markers =
    asyncio: async test marker (pytest-asyncio)
# A coroutine that is created but never awaited is a lost state change, not
# noise - Home Assistant just never hears about the event. Only the bare
# category filter fails the suite for it: the warning reaches pytest through its
# unraisable-exception hook, so a module-targeted filter never matches, and
# pytest>=9 dropped --unraisableexception=raise. (Verified with a throwaway
# leaking test: targeted filters pass, this one fails the test.)
#
# Limitation: a coroutine that is only collected between tests is still
# reported as a warning rather than a failure, so keep the leak itself fixed.
filterwarnings =
    error::RuntimeWarning




