name: Build Add-on

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["aarch64", "amd64", "armv7"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image repository name
        id: prep
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Audit Python and frontend dependencies
        working-directory: modules/bridge
        run: |
          python3 -m pip install --disable-pip-version-check pip-audit==2.7.3
          python3 -m pip_audit --strict --requirement backend/requirements.txt
          npm --prefix web_ui ci --ignore-scripts
          npm --prefix web_ui audit --audit-level=high

      - name: Scan repository dependency inputs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: modules/bridge
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Add-on with Home Assistant Builder
        uses: home-assistant/builder@2025.03.0
        with:
          args: >-
            --${{ matrix.arch }}
            --target /data
            --image {arch}-bl-haos-bridge
            --docker-hub ghcr.io/${{ steps.prep.outputs.owner }}
