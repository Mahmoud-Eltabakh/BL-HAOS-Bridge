name: Build Add-on

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release-gates:
    name: Release contract and SIL evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration test dependencies
        run: python3 -m pip install --disable-pip-version-check -r tests/integration/requirements-test.txt

      - name: Run release contract and orchestration checks
        run: |
          python -m pytest tests/integration/tests/test_release_contract.py tests/integration/tests/test_orchestration.py -q

      - name: Build canonical SIL runner image
        run: docker compose -f tests/integration/docker-compose.yml build test-runner

      - name: Run canonical sequential SIL runner
        run: docker compose -f tests/integration/docker-compose.yml run --rm test-runner

      - name: Require release evidence artifacts
        shell: bash
        run: |
          set -euo pipefail
          for report in bridge-junit.xml integration-junit.xml sil-junit.xml coverage.xml; do
            test -s "tests/integration/reports/${report}"
          done
          test -d tests/integration/reports/coverage-html

      - name: Assert manifest and build architecture parity
        shell: bash
        run: |
          set -euo pipefail
          for arch in aarch64 amd64 armv7; do
            grep -Fq "${arch}" modules/bridge/config.yaml
            grep -Fq "${arch}" modules/bridge/build.yaml
            grep -Fq "${arch}" modules/bridge/.github/workflows/builder.yaml
          done
          grep -Fq 'image: "ghcr.io/mahmoud-eltabakh/{arch}-bl-haos-bridge"' modules/bridge/config.yaml

      - name: Upload redacted release evidence
        uses: actions/upload-artifact@v4
        with:
          name: bl-haos-release-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            tests/integration/reports/bridge-junit.xml
            tests/integration/reports/integration-junit.xml
            tests/integration/reports/sil-junit.xml
            tests/integration/reports/coverage.xml
            tests/integration/reports/coverage-html

  build:
    name: Build ${{ matrix.arch }}
    needs: release-gates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["aarch64", "amd64", "armv7"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image repository name
        id: prep
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Audit Python and frontend dependencies
        working-directory: modules/bridge
        run: |
          python3 -m pip install --disable-pip-version-check pip-audit==2.7.3
          python3 -m pip_audit --strict --requirement backend/requirements.txt
          npm --prefix web_ui ci --ignore-scripts
          npm --prefix web_ui audit --audit-level=high

      - name: Scan repository dependency inputs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: modules/bridge
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Add-on with Home Assistant Builder
        uses: home-assistant/builder@2025.03.0
        with:
          args: >-
            --${{ matrix.arch }}
            --target /data
            --image {arch}-bl-haos-bridge
            --docker-hub ghcr.io/${{ steps.prep.outputs.owner }}
