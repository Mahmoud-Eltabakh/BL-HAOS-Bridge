[server]
threads = -1
datadir = /var/lib/snapserver

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
doc_root = /usr/share/snapserver/snapweb

[tcp]
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[stream]
bind_to_address = 0.0.0.0
port = 1704
sampleformat = 48000:16:2
codec = flac
stream = pipe:///tmp/snapcast/snapfifo?name=default&sampleformat=48000:16:2
